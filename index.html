<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e0e10">
    <title>Best MM2 Scripts</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <!-- Подключение премиальных шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0e0e10;
            --bg-secondary: #141417;
            --bg-tertiary: #1a1a1e;
            --border-color: #252528;
            --text-main: #e4e4e7;
            --text-dim: #71717a;
            --accent: #a020f0;
            --accent-hover: #b340f5;
            --accent-glow: rgba(160, 32, 240, 0.25);
            --danger: #ff4444;
            --success: #44ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% -20%, rgba(160, 32, 240, 0.1) 0%, transparent 60%);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Header */
        header {
            background: rgba(20, 20, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #a020f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
        }

        .logo span {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            margin-left: 2px;
        }

        .nav-link {
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link.active, .nav-link:hover {
            color: white;
            background: var(--accent-glow);
            border-color: var(--accent);
        }

        /* Layout */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .hero {
            background: linear-gradient(145deg, rgba(26, 26, 30, 0.8) 0%, rgba(20, 20, 23, 0.4) 100%);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            padding: 45px 35px;
            margin-bottom: 30px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(160, 32, 240, 0.05);
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #d1d1d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-dim);
            font-size: 1rem;
            max-width: 600px;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Grid */
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .script-card {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeIn 0.5s forwards;
        }

        .script-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px var(--accent-glow);
        }

        /* Убираем старую полоску, добавляем красивое свечение снизу */
        .script-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 0 0 12px 12px;
        }

        .script-card:hover::after {
            opacity: 1;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 10px;
        }

        .script-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .script-status {
            font-size: 0.65rem;
            padding: 4px 8px;
            background: rgba(68, 255, 136, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(68, 255, 136, 0.15);
        }

        .script-status.patched {
            background: rgba(255, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 0 8px rgba(255, 68, 68, 0.15);
        }

        .script-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 20px;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .btn-copy {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
            width: 100%;
            border-radius: 6px;
            font-weight: 500;
        }

        .btn-copy:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 40px var(--accent-glow);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal h2 {
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            font-size: 1.2rem;
            padding-right: 20px;
        }

        .code-block {
            background: #08080a;
            border: 1px solid var(--border-color);
            padding: 18px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            word-wrap: break-word;
            word-break: break-all;
            user-select: all;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .btn-copy-code {
            margin-top: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.2s;
            border-radius: 6px;
        }

        .btn-copy-code:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--success);
            color: var(--text-main);
            padding: 14px 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            z-index: 1000;
            transition: transform 0.3s ease;
            text-align: center;
            max-width: 90%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            header {
                padding: 15px;
            }
            .logo {
                font-size: 1rem;
            }
            .nav-link {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
            .container {
                padding: 0 15px;
                margin: 20px auto;
            }
            .hero {
                padding: 30px 20px;
                border-radius: 10px;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .hero p {
                font-size: 0.9rem;
            }
            .scripts-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .script-card {
                padding: 20px;
                border-radius: 10px;
            }
            .modal {
                padding: 20px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MM2<span>SCRIPTS</span></div>
        <a href="#" class="nav-link active">Scripts</a>
    </header>

    <div class="container">
        <div class="hero">
            <h1>MM2 Script Catalog</h1>
            <p>Premium collection of Murder Mystery 2 scripts. Optimized performance, clean code, and stable execution.</p>
        </div>

        <div class="scripts-grid" id="scriptsGrid"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 id="modalTitle">Script Source</h2>
            <div class="code-block" id="modalCode"></div>
            <button class="btn-copy-code" onclick="copyModalCode()">Copy Script</button>
        </div>
    </div>

    <div class="toast" id="toast">Script copied to clipboard!</div>

    <footer>
        Top Scripts! © 2019 - 2026 | Not affiliated with Roblox Corporation
    </footer>

    <script>
        const scripts = [
            {
                title: "Overdrive h Premium (Keyless)",
                desc: "Premium features without any key system. Includes god mode, silent aim, and full ESP.",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/OverdriveH"))()'
            },
                        {
                title: "YARHM",
                desc: "Keyless script for mm2. Top Shoot murder; Esp; Steal Gun and more!",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/Yarhm"))()'
            },
            {
                title: "Vertex Hub",
                desc: "MM2 Vertex script with Kill Aura, Silent Aim, and auto-shot on the assassin. ESP highlights roles, Fling scatters enemies across the map.",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/Vertex"))()'
            },
            {
                title: "Autofarm Summer 2026",
                desc: "Automatically farms the Summer 2026 event currency. Bypasses anti-cheat teleports.",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/AutoFarm"))()'
            },
            {
                title: "Universal Hub",
                desc: "All-in-one hub with player mods, visual enhancements, and server-side tools.",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/UniversalHub"))()'
            },
            {
                title: "Weapon Spawner",
                desc: "Spawn any weapon directly into your inventory. Bypasses server-side checks.",
                status: "Working",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/n0jsp/Site/refs/heads/main/Loader"))()'
            }
        ];

        const grid = document.getElementById('scriptsGrid');

        function renderScripts() {
            grid.innerHTML = '';
            scripts.forEach((script, index) => {
                const statusClass = script.status === 'Working' ? '' : 'patched';
                const card = document.createElement('div');
                card.className = 'script-card';
                
                // Добавляем задержку для анимации появления (каскадом)
                card.style.animationDelay = `${index * 0.08}s`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="script-title">${script.title}</div>
                        <div class="script-status ${statusClass}">${script.status}</div>
                    </div>
                    <div class="script-desc">${script.desc}</div>
                    <div class="card-footer">
                        <button class="btn-copy" data-code="${encodeURIComponent(script.code)}" data-title="${script.title}">View Script</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const title = this.getAttribute('data-title');
                    const code = decodeURIComponent(this.getAttribute('data-code'));
                    openModal(title, code);
                });
            });
        }

        function openModal(title, code) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalCode').innerText = code;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function copyModalCode() {
            const code = document.getElementById('modalCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                showToast();
            }).catch(err => {
                alert('Failed to copy. Please copy manually.');
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize
        renderScripts();
    </script>
</body>
</html>
